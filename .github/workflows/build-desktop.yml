name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Build Tauri app
        run: npx tauri build
        working-directory: desktop-app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jurobot-linux
          path: |
            desktop-app/src-tauri/target/release/bundle/deb/*.deb
            desktop-app/src-tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Build Tauri app
        run: npx tauri build
        working-directory: desktop-app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jurobot-windows
          path: |
            desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            desktop-app/src-tauri/target/release/bundle/msi/*.msi
