<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jurobot</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:default;user-select:none}
    canvas{display:block;width:100%;height:100%}

    #hud-overlay{position:fixed;inset:0;z-index:10;pointer-events:none}
    #hud-overlay.active-controls{pointer-events:auto}

    #override-btn{position:fixed;bottom:20px;right:20px;z-index:50;pointer-events:auto;background:linear-gradient(180deg,#7a7a7a,#4a4a4a);border:3px solid #333;border-top-color:#999;border-left-color:#999;color:#fff;font-family:monospace;font-size:18px;padding:12px 28px;cursor:pointer;text-shadow:2px 2px 0 #222;letter-spacing:1px;transition:opacity .3s;image-rendering:pixelated}
    #override-btn:hover{background:linear-gradient(180deg,#8a8a8a,#5a5a5a)}
    #override-btn.active{background:linear-gradient(180deg,#4caf50,#2e7d32);border-color:#1b5e20;border-top-color:#66bb6a;border-left-color:#66bb6a}
    #override-btn.active:hover{background:linear-gradient(180deg,#5cbf60,#3e8d42)}

    #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;opacity:0.8}
    #crosshair .h{position:absolute;width:14px;height:2px;top:-1px;left:-7px;background:rgba(255,255,255,0.8);border-radius:1px}
    #crosshair .v{position:absolute;width:2px;height:14px;top:-7px;left:-1px;background:rgba(255,255,255,0.8);border-radius:1px}
    #crosshair .dot{position:absolute;width:3px;height:3px;top:-1.5px;left:-1.5px;background:rgba(255,255,255,0.5);border-radius:50%}

    #hotbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:2px;background:rgba(0,0,0,0.6);padding:4px;border-radius:3px;border:2px solid rgba(255,255,255,0.12);pointer-events:none}
    #hotbar .slot{width:40px;height:40px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);border-radius:2px;position:relative}
    #hotbar .slot.active{border-color:#fff;background:rgba(255,255,255,0.1);box-shadow:inset 0 0 4px rgba(255,255,255,0.15)}
    #hotbar .slot .num{position:absolute;bottom:1px;right:2px;font-size:9px;color:rgba(255,255,255,0.35);font-family:monospace}

    #bars{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:16px;align-items:flex-end;pointer-events:none}
    #bars .bar-group{display:flex;flex-direction:column;align-items:center;gap:1px}
    #bars .bar-row{display:flex;gap:1px}
    #bars .icon{width:9px;height:9px;display:inline-block;border-radius:0;image-rendering:pixelated}
    #armor-icons .icon{background:#888}
    #hp-icons .icon{background:#f33}
    #food-icons .icon{background:#d4a04a}
    #bars .icon.half{opacity:0.6}
    #bars .icon.empty{background:rgba(255,255,255,0.08)}

    #xp-container{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:20;width:182px;height:5px;background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.1);pointer-events:none;border-radius:1px}
    #xp-bar{height:100%;width:0%;border-radius:1px}

    #status-text{position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,0.45);padding:2px 12px;border-radius:3px;font-size:11px;color:rgba(255,255,255,0.55);font-family:monospace;pointer-events:none}

    #debug-info{position:fixed;top:20px;left:4px;z-index:30;font-size:11px;color:rgba(255,255,255,0.5);font-family:monospace;line-height:1.5;text-shadow:1px 1px 1px #000;pointer-events:none}

    #chat{position:fixed;bottom:96px;left:8px;z-index:25;max-width:420px;pointer-events:none}
    #chat-messages{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
    #chat-messages .chat-msg{font-size:13px;color:#fff;text-shadow:1px 1px 2px #000;line-height:1.3;word-wrap:break-word;font-family:monospace}
    #chat-messages .chat-msg.system{color:#aaf}
    #chat-input-area{display:none;pointer-events:auto}
    #chat-input{width:300px;padding:4px 6px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:13px;font-family:monospace;outline:none;border-radius:2px}
    #chat-input::placeholder{color:rgba(255,255,255,0.2)}

    #click-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;color:rgba(255,255,255,0.3);font-size:13px;font-family:monospace;text-align:center;pointer-events:none;text-shadow:1px 1px 2px #000}
  </style>
</head>
<body>

<div id="click-hint">Click to focus</div>

<div id="override-btn">OVERRIDE</div>

<div id="crosshair"><div class="h"></div><div class="v"></div><div class="dot"></div></div>

<div id="status-text">Connecting...</div>
<div id="debug-info">XYZ: --</div>

<div id="bars">
  <div class="bar-group">
    <div id="armor-icons" class="bar-row"></div>
    <div id="hp-icons" class="bar-row"></div>
    <div id="food-icons" class="bar-row"></div>
  </div>
</div>

<div id="xp-container"><div id="xp-bar"></div></div>

<div id="hotbar"></div>

<div id="chat">
  <div id="chat-messages"></div>
  <div id="chat-input-area"><input id="chat-input" type="text" placeholder="Type a message..." maxlength="256"></div>
</div>

<div id="hud-overlay"></div>

</body>
</html>
